function niceScale(maxValue, tickCount = 4) {
  if (maxValue <= 0) maxValue = 1;
  const rawStep = maxValue / tickCount;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const norm = rawStep / mag;
  let step;
  if (norm <= 1) step = mag;
  else if (norm <= 2) step = 2 * mag;
  else if (norm <= 2.5) step = 2.5 * mag;
  else if (norm <= 5) step = 5 * mag;
  else step = 10 * mag;
  return { step, max: Math.ceil(maxValue / step) * step };
}

async function fetchAll(path){
  const sep=path.includes('?')?'&':'?';
  const r0=await fetch(SUPABASE_URL+path+sep+`limit=1000&offset=0`,{headers:{...HD,Prefer:'count=exact'}});
  if(!r0.ok)throw new Error('HTTP '+r0.status);
  const j0=await r0.json();
  const cr=r0.headers.get('content-range');
  const total=(cr&&cr.includes('/'))?Number(cr.split('/')[1]):j0.length;
  if(!total||total<=1000)return j0;
  const offs=[]; for(let o=1000;o<total;o+=1000)offs.push(o);
  let out=j0;
  for(let i=0;i<offs.length;i+=8){
    const res=await Promise.all(offs.slice(i,i+8).map(o=>fetch(SUPABASE_URL+path+sep+`limit=1000&offset=${o}`,{headers:HD}).then(r=>r.ok?r.json():[])));
    res.forEach(j=>{out=out.concat(j);});
  }
  return out;
}

      off+=1000;
    }
    DEVIATION_HISTORY=out;
  }catch(e){DEVIATION_HISTORY=[];}
}

async function saveStockDay(tISO, stockMap){
  const rows=[];
  for(const o in stockMap){ for(const wh in stockMap[o]){ const v=stockMap[o][wh];
    if(v!=null) rows.push({report_date:tISO,offer_id:o,warehouse_name:wh,stock:v}); } }
  const seen=new Set(Object.keys(stockMap));
  for(const r of ROWS){ if(!seen.has(r.offer_id)) rows.push({report_date:tISO,offer_id:r.offer_id,warehouse_name:'НЕТ_В_ОТЧЁТЕ',stock:0}); }
  await fetch(SUPABASE_URL+'/rest/v1/stock_history?report_date=eq.'+tISO,{method:'DELETE',headers:HD});
  if(!rows.length)return;
  for(let i=0;i<rows.length;i+=500){ const part=rows.slice(i,i+500);
    await fetch(SUPABASE_URL+'/rest/v1/stock_history?on_conflict=report_date,offer_id,warehouse_name',{
      method:'POST',headers:{...HD,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},
      body:JSON.stringify(part)}); }

function computeDay(tISO, stockMap){
  const T=DOW_TARGET[parseISO(tISO).getDay()];
  const pAgg=new Map();
  for(const r of ROWS){
    const o=r.offer_id;
    const whs=new Set([...Object.keys(stockMap[o]||{}),...Object.keys(SALES[o]||{})]);
    whs.forEach(wh=>{
      const stock=stockMap[o]?.[wh]||0;
      const s1=SALES[o]?.[wh]?.[tISO]||0;
      if(stock===0&&s1===0)return;
      const cost=COST[r.product_id]||0;
      let p=pAgg.get(o);
      if(!p){p={o:o,pid:r.product_id,matrix:matrixOf(o),stock:0,sum:0,clusters:new Map()};pAgg.set(o,p);}
      p.stock+=stock; p.sum+=stock*cost;
      const cl=WHCLUSTER[wh]||'Прочее';
      if(!p.clusters.has(cl))p.clusters.set(cl,{cs:0,c1:0});
      const g=p.clusters.get(cl); g.cs+=stock; g.c1+=s1;
    });
  }
  const rows=[];
  const tMkt={m1:{sup:0,def:0},m2:{sup:0,def:0}};
  const cov={m1:{lt20:0,b2050:0,gt50:0,ns:0},m2:{lt20:0,b2050:0,gt50:0,ns:0}};
  const clAgg=new Map();
  pAgg.forEach(p=>{
    let up=0,down=0,total=0,s1total=0;
    const upClusters=[],downClusters=[];
    p.clusters.forEach((g,c)=>{
      const dev=(g.cs/T - g.c1)/SMOOTH_DAYS;
      total+=dev; s1total+=g.c1;
      const dir=dev>0.01?'up':(dev<-0.01?'down':0);
      const chg=Math.abs(dev);
      if(dir==='up'){up+=chg; tMkt[p.matrix].sup+=dev; upClusters.push(c);}
      else if(dir==='down'){down+=chg; tMkt[p.matrix].def+=dev; downClusters.push(c);}
      const k=p.matrix+'|'+c;
      if(!clAgg.has(k))clAgg.set(k,{matrix:p.matrix,cluster:c,dev:0,up:0,down:0});
      const o=clAgg.get(k); o.dev+=dev;
      if(dir==='up')o.up+=chg; else if(dir==='down')o.down+=chg;
    });
    if(p.stock>0){
      const days=s1total>0?p.stock/s1total:Infinity;
      const b=days<20?'lt20':(days<=50?'b2050':'gt50');
      cov[p.matrix][b]++;
    }else{
      cov[p.matrix].ns++;
    }
    rows.push({entity_type:'product',entity_key:p.o,report_date:tISO,deviation:total,dev_up:up,dev_down:down,clusters_up:upClusters.join('|'),clusters_down:downClusters.join('|'),fire:false});
  });
  clAgg.forEach(v=>rows.push({entity_type:'cluster',entity_key:v.matrix+':'+v.cluster,report_date:tISO,deviation:v.dev,dev_up:v.up,dev_down:v.down,fire:false}));
  ['m1','m2'].forEach(mk=>{
    rows.push({entity_type:'market',entity_key:mk+':sup',report_date:tISO,deviation:tMkt[mk].sup,dev_up:null,dev_down:null,fire:false});
    rows.push({entity_type:'market',entity_key:mk+':def',report_date:tISO,deviation:tMkt[mk].def,dev_up:null,dev_down:null,fire:false});
    ['lt20','b2050','gt50','ns'].forEach(b=>rows.push({entity_type:'coverage',entity_key:mk+':'+b,report_date:tISO,deviation:cov[mk][b],dev_up:null,dev_down:null,fire:false}));
  });
  return rows;
}

function weekStartOf(iso){ const d=parseISO(iso); d.setDate(d.getDate()-((d.getDay()+6)%7)); return localISO(d); }
function isoWeeksOfMonth(y,m){
  const out=[]; let d=new Date(y,m,1);
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  for(let i=0;i<6;i++){ const thu=new Date(d); thu.setDate(thu.getDate()+3);
    if(thu.getFullYear()===y&&thu.getMonth()===m) out.push(new Date(d));
    d.setDate(d.getDate()+7); }

}

function parseCSV(t){const rows=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){cur+='"';i++;}else q=false;}else cur+=c;}else{if(c=='"')q=true;else if(c==';'){row.push(cur);cur='';}else if(c==','){row.push(cur);cur='';}else if(c=='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(c!='\r')cur+=c;}}if(cur!==''||row.length){row.push(cur);rows.push(row);}return rows;}

async function importFile(file){

    const agg=new Map(); let skipped=0;
    const nowD=new Date();
    const YEST=localISO(new Date(nowD.getFullYear(),nowD.getMonth(),nowD.getDate()-1));
    for(const r of rows){
      if(/отмен/i.test((r[4]||'').trim())){skipped++;continue;}
      const dt=(r[2]||'').trim().slice(0,10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)){skipped++;continue;}
      if(dt>YEST){skipped++;continue;}
      const offer=(r[11]||'').trim(), qty=Number(r[18]||0), price=Number(r[14]||0), wh=(r[29]||'').trim();
      if(!offer||!wh||!isFinite(qty)){skipped++;continue;}
      const k=dt+'|'+offer+'|'+wh;
      const cur=agg.get(k)||{qty:0,rev:0};
      cur.qty+=qty; cur.rev+=qty*price;
      agg.set(k,cur);
    }
    const out=[...agg.entries()].map(([k,v])=>{const [sale_date,offer_id,warehouse_name]=k.split('|');return {sale_date,offer_id,warehouse_name,qty:v.qty,revenue:Math.round(v.rev*100)/100};});
    if(!out.length){ setP(100,'В файле нет подходящих строк (все пропущены).',true); setTimeout(()=>document.getElementById('progWrap').classList.add('hide'),5000); return; }
    for(let i=0;i<out.length;i+=500){
      const part=out.slice(i,i+500);

      if(!r.ok)throw new Error('HTTP '+r.status);
    }
    out.forEach(x=>{
      ((SALES[x.offer_id]=SALES[x.offer_id]||{})[x.warehouse_name]=SALES[x.offer_id][x.warehouse_name]||{});
      SALES[x.offer_id][x.warehouse_name][x.sale_date]=(SALES[x.offer_id][x.warehouse_name][x.sale_date]||0)+x.qty;
    });
    const D=out.reduce((m,x)=>x.sale_date>m?x.sale_date:m,'');
    setP(85,`✔ Импортировано строк: ${out.length}. Фиксирую день ${D}…`);
    await saveStockDay(D, STOCK_NOW);
    STOCK_ALL[D]=STOCK_NOW;
    const r0=computeDay(D,STOCK_NOW);
    upsertHistoryMemory(r0);
    await saveHistory(r0);
    await syncWeekFacts([...new Set(out.map(x=>weekStartOf(x.sale_date)))]);
    await load();
    setP(100,`✔ Готово! Импортировано строк: ${out.length} (пропущено: ${skipped}). День ${D} зафиксирован.`);
    setTimeout(()=>document.getElementById('progWrap').classList.add('hide'),5000);
  }catch(e){
    setP(100,'Ошибка импорта: '+e.message,true);
  }finally{
    importing=false; document.getElementById('btnCsv').disabled=false;
    document.getElementById('fileInput').value='';
  }

function kpiDeltaFromHistory(entityType, entityKey, dir, curLive){
  const recs=histRows().filter(r=>r.entity_type===entityType&&r.entity_key===entityKey)
    .sort((a,b)=>a.report_date.localeCompare(b.report_date));
  const val=(r)=>{
    let v=(dir==='up')?r.dev_up:r.dev_down;
    if(v==null) v=(r.deviation!=null?Math.abs(Number(r.deviation)):null);
    return v!=null?Math.abs(Number(v)):null;
  };
  const cur=curLive;
  const mk=(n)=>{
    if(cur==null) return null;
    const t=localISO(new Date(BASE.getFullYear(),BASE.getMonth(),BASE.getDate()-n));
    const prevRec=recs.find(r=>r.report_date===t);
    const past=prevRec?val(prevRec):null;
    if(past==null) return {abs:null,cur:cur,past:null,target:t};
    return {abs:cur-past,cur:cur,past:past,target:t};
  };
  return [mk(1),mk(3),mk(7)];
}

function arcPath(cx,cy,rO,rI,a0,a1){
  const p=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
  const [x0,y0]=p(rO,a0),[x1,y1]=p(rO,a1),[x2,y2]=p(rI,a1),[x3,y3]=p(rI,a0);
  const large=(a1-a0)>Math.PI?1:0;
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${rO} ${rO} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} L${x2.toFixed(2)} ${y2.toFixed(2)} A${rI} ${rI} 0 ${large} 0 ${x3.toFixed(2)} ${y3.toFixed(2)} Z`;
}

function coverageBuckets(prods,mk){
  const buckets=[
    {key:'lt20',label:'<20 дн',color:'#E33D78',cnt:0,value:0},
    {key:'b2050',label:'20–50 дн',color:'#16a34a',cnt:0,value:0},
    {key:'gt50',label:'>50 дн',color:'#d97706',cnt:0,value:0},
    {key:'ns',label:'нет остатка',color:'#94a3b8',cnt:0,value:0}
  ];
  prods.forEach(p=>{
    if(p.matrix!==mk) return;
    if(p.stock<=0){ buckets[3].cnt++; return; }
    const days=p.s1total>0 ? p.stock/p.s1total : Infinity;
    const b=days<20?buckets[0]:(days<=50?buckets[1]:buckets[2]);
    b.cnt++;
    b.value+=p.sum;
  });
  return buckets;
}
function attachChart(box, tooltip){
  box.querySelectorAll('.chart-point').forEach(pt => {
    pt.dataset.r0 = pt.getAttribute('r');
    const show = () => {
      const b = box.getBoundingClientRect(), r = pt.getBoundingClientRect();
      tooltip.innerHTML = `<strong>${pt.dataset.label}</strong>${pt.dataset.value}`;
      tooltip.style.display = 'block';
      tooltip.style.left = (r.left - b.left + r.width / 2) + 'px';
      tooltip.style.top = (r.top - b.top - 8) + 'px';
      pt.setAttribute('r', String(parseFloat(pt.dataset.r0) + 2));
    };
    const hide = () => {
      tooltip.style.display = 'none';
      pt.setAttribute('r', pt.dataset.r0);
    };
    pt.addEventListener('mouseenter', show);
    pt.addEventListener('mouseleave', hide);
  });
}
function drawSplitChart(boxEl, tipEl, days, series) {
  const n = days.length;
  const W = 950, H = 460, padL = 64, padR = 64, padT = 24, padB = 50;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const midY = padT + innerH / 2;
  let maxAbs = 1;
  ['m1','m2'].forEach(mk => {
    series[mk].sup.forEach(v => { if (v > maxAbs) maxAbs = v; });
    series[mk].def.forEach(v => { if (Math.abs(v) > maxAbs) maxAbs = Math.abs(v); });
  });
  const scale = niceScale(maxAbs, 3);
  const x = i => padL + (n === 1 ? innerW / 2 : innerW * i / (n - 1));
  const y = v => midY - (v / scale.max) * (innerH / 2);
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">`;
  [-1, -0.5, 0, 0.5, 1].forEach(f => {
    const v = scale.max * f, yy = y(v);
    svg += `<line x1="${padL-4}" y1="${yy}" x2="${padL}" y2="${yy}" stroke="#94a3b8" stroke-width="1.5"/>`;
    svg += `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="${f===0?'#94a3b8':'#e5e7eb'}" stroke-width="${f===0?1.5:1}" ${f!==0?'stroke-dasharray="2 4"':''}/>`;
    svg += `<text x="${padL-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="#544273" font-family="Forum">${f>0?'+':''}${fmt(v)}</text>`;
  });
  svg += `<text x="${padL-8}" y="${padT-6}" text-anchor="end" font-size="10" font-weight="700" fill="#7D3673" font-family="Forum">шт/день</text>`;
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+innerH}" stroke="#94a3b8" stroke-width="1.5"/>`;
  svg += `<line x1="${padL}" y1="${padT+innerH}" x2="${W-padR}" y2="${padT+innerH}" stroke="#94a3b8" stroke-width="1.5"/>`;
  days.forEach((d, i) => { svg += `<text x="${x(i)}" y="${padT+innerH+16}" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="Forum">${d.slice(8,10)}.${d.slice(5,7)}</text>`; });
  svg += `<text x="${W-padR}" y="${padT+innerH+30}" text-anchor="end" font-size="10" font-weight="700" fill="#7D3673" font-family="Forum">дни</text>`;
  const mkPath = (vals, col, dashed) => {
    if (vals.length < 2) return '';
    let dstr = `M ${x(0)} ${y(vals[0])}`;
    vals.forEach((v, i) => { if (i > 0) dstr += ` L ${x(i)} ${y(v)}`; });
    return `<path ${dashed?'':'class="chart-line"'} d="${dstr}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round" ${dashed?'stroke-dasharray="6 5"':''}/>`;
  };
  [['m1',C_M1],['m2',C_M2]].forEach(([mk,col]) => {
    svg += mkPath(series[mk].sup, col, false);
    svg += mkPath(series[mk].def, col, true);
    days.forEach((d, i) => {
      const tipVal = `↑ увеличить продажи: +${fmt(series[mk].sup[i])} шт/день • ↓ снизить продажи: ${fmt(series[mk].def[i])} шт/день`;
      svg += `<circle class="chart-point" cx="${x(i)}" cy="${y(series[mk].sup[i])}" r="3.5" fill="${col}" data-label="${MATRIX_NAME[mk]}, ${d.slice(8,10)}.${d.slice(5,7)}" data-value="${tipVal}"/>`;
      svg += `<circle class="chart-point" cx="${x(i)}" cy="${y(series[mk].def[i])}" r="3.5" fill="#fff" stroke="${col}" stroke-width="2" data-label="${MATRIX_NAME[mk]}, ${d.slice(8,10)}.${d.slice(5,7)}" data-value="${tipVal}"/>`;
    });
  });
  const bx = W - padR + 6, xe = bx + 6;
  const brace = (y0, y1) => {
    const ym = (y0 + y1) / 2;
    return `M ${bx} ${y0} Q ${xe} ${y0} ${xe} ${y0+10} L ${xe} ${ym-6} Q ${xe} ${ym} ${xe+5} ${ym} Q ${xe} ${ym} ${xe} ${ym+6} L ${xe} ${y1-10} Q ${xe} ${y1} ${bx} ${y1}`;
  };
  svg += `<path d="${brace(padT+2, midY-6)}" fill="none" stroke="#7D3673" stroke-width="1.5" opacity="0.8"/>`;
  svg += `<path d="${brace(midY+6, padT+innerH-2)}" fill="none" stroke="#7D3673" stroke-width="1.5" opacity="0.8"/>`;
  const t1 = (padT + midY) / 2, t2 = (midY + padT + innerH) / 2;
  svg += `<text x="${xe+16}" y="${t1}" transform="rotate(-90 ${xe+16} ${t1})" text-anchor="middle" font-size="10" font-weight="700" fill="#7D3673" font-family="Forum">↑ увеличить продажи</text>`;
  svg += `<text x="${xe+16}" y="${t2}" transform="rotate(-90 ${xe+16} ${t2})" text-anchor="middle" font-size="9" font-weight="700" fill="#7D3673" font-family="Forum">↓ снизить продажи</text>`;
  svg += `<text x="${xe+28}" y="${t2}" transform="rotate(-90 ${xe+28} ${t2})" text-anchor="middle" font-size="9" font-weight="700" fill="#7D3673" font-family="Forum">либо пополнить остаток</text>`;
  svg += `</svg>`;
  boxEl.querySelectorAll('svg').forEach(el => el.remove());
  boxEl.insertAdjacentHTML('beforeend', svg);
  boxEl.querySelectorAll('.chart-line').forEach(path => {
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    path.getBoundingClientRect();
    path.style.transition = 'stroke-dashoffset 1s ease';
    path.style.strokeDashoffset = '0';
  });
  attachChart(boxEl, tipEl);
}

    if(MODE==='products'){
      const prodNode=(p,dir)=>{
        const cl=p.clArr.filter(g=>g.dir===dir);
        const ch=cl.reduce((s,g)=>s+g.change,0);
        let out=`<details class="cluster" data-jump-id="prod:${esc(p.o)}:${dir}"><summary><span class="clname" title="${esc(p.name)}">${esc(p.o)}</span><span class="cltot">Σ ${f1(ch)} шт/день • ${cl.length} кл.</span></summary><div class="tablewrap"><table><thead>${head7}</thead>`;
        cl.forEach(g=>{
          out+=`<tbody class="clbody closed"><tr class="clrow" onclick="this.closest('tbody').classList.toggle('closed')">
            <td><span class="caret">▾</span>${esc(g.c)}${g.rec?`<span class="rec ${g.rec.cls}">${g.rec.txt}</span>`:''}</td>
            <td class="num">${fmt(g.cs)}</td><td class="num">${fmt(g.csum)}</td>${daysCell(g.cs,g.c1)}${cmpCell(g.c3,g.c4)}${cmpCell(g.c2,g.c3)}${cmpCell(g.c1,g.c2)}</tr>`+whRows(g.arr)+`</tbody>`;
        });
        out+=`</table></div></details>`;
        return out;
      };
      const section=(title,arr,dir)=>{
        const list=arr.filter(p=>p.clArr.some(g=>g.dir===dir))
          .map(p=>{p._ch=p.clArr.filter(g=>g.dir===dir).reduce((s,g)=>s+g.change,0);return p;})
          .sort((a,b)=>b._ch-a._ch);
        if(!list.length)return '';
        const total=list.reduce((s,p)=>s+p._ch,0);
        return `<details class="sup" data-dir="${dir}"><summary><span class="clname">${title} — ${list.length} поз.</span><span class="cltot">Σ ${f1(total)} шт/день</span></summary><div class="supbody">`+list.map(p=>prodNode(p,dir)).join('')+`</div></details>`;
      };
      [...byMatrix.keys()].sort().forEach(mkk=>{
        const arr=byMatrix.get(mkk);
        const mSum=arr.reduce((s,p)=>s+p.sum,0), mStock=arr.reduce((s,p)=>s+p.stock,0);
        html+=`<details class="matrix" data-matrix="${mkk}"><summary><span class="clname">${MATRIX_NAME[mkk]}</span><span class="cltot">${fmt(mSum)} ₽ • ${fmt(mStock)} шт</span></summary><div class="matrixbody">`;
        html+=section('📦 Увеличить продажи',arr,'up');
        html+=section('⛔ Снизить продажи либо пополнить остаток',arr,'down');
        html+=`</div></details>`;
      });
    }else{
      const clusterNode=(cname,list,mkk,dir)=>{
        const ch=list.reduce((s,x)=>s+x.change,0);
        let out=`<details class="cluster" data-jump-id="cl:${mkk}:${dir}:${esc(cname)}"><summary><span class="clname">${esc(cname)}</span><span class="cltot">Σ ${f1(ch)} шт/день • ${list.length} поз.</span></summary><div class="tablewrap"><table><thead>${head7}</thead>`;
        list.sort((a,b)=>b.change-a.change).forEach(x=>{
          out+=`<tbody class="clbody closed"><tr class="clrow" onclick="this.closest('tbody').classList.toggle('closed')">
            <td><span class="caret">▾</span><span title="${esc(x.name)}">${esc(x.o)}</span>${x.rec?`<span class="rec ${x.rec.cls}">${x.rec.txt}</span>`:''}</td>
            <td class="num">${fmt(x.cs)}</td><td class="num">${fmt(x.csum)}</td>${daysCell(x.cs,x.c1)}${cmpCell(x.c3,x.c4)}${cmpCell(x.c2,x.c3)}${cmpCell(x.c1,x.c2)}</tr>`+whRows(x.arr)+`</tbody>`;
        });
        out+=`</table></div></details>`;
        return out;
      };
      const clusterSection=(title,pc,dir,mkk)=>{
        const list=pc.filter(x=>x.dir===dir);
        if(!list.length)return '';
        const byCl=new Map();
        list.forEach(x=>{if(!byCl.has(x.cluster))byCl.set(x.cluster,[]);byCl.get(x.cluster).push(x);});
        const clusters=[...byCl.entries()].map(([c,a])=>({c,a,ch:a.reduce((s,x)=>s+x.change,0)})).sort((a,b)=>b.ch-a.ch);
        const total=clusters.reduce((s,c)=>s+c.ch,0);
        return `<details class="sup" data-dir="${dir}"><summary><span class="clname">${title} — ${clusters.length} кл.</span><span class="cltot">Σ ${f1(total)} шт/день</span></summary><div class="supbody">`+clusters.map(cl=>clusterNode(cl.c,cl.a,mkk,dir)).join('')+`</div></details>`;
      };
      [...byMatrix.keys()].sort().forEach(mkk=>{
        const arr=byMatrix.get(mkk);
        const pc=[];
        arr.forEach(p=>{p.clArr.forEach(g=>{ if(g.dir) pc.push({o:p.o,name:p.name,cluster:g.c,cs:g.cs,csum:g.csum,c1:g.c1,c2:g.c2,c3:g.c3,c4:g.c4,rec:g.rec,dir:g.dir,change:g.change,arr:g.arr}); });});
        const mSum=arr.reduce((s,p)=>s+p.sum,0), mStock=arr.reduce((s,p)=>s+p.stock,0);
        html+=`<details class="matrix" data-matrix="${mkk}"><summary><span class="clname">${MATRIX_NAME[mkk]}</span><span class="cltot">${fmt(mSum)} ₽ • ${fmt(mStock)} шт</span></summary><div class="matrixbody">`;
        html+=clusterSection('📦 Увеличить продажи',pc,'up',mkk);
        html+=clusterSection('⛔ Снизить продажи либо пополнить остаток',pc,'down',mkk);
        html+=`</div></details>`;
      });
    }
    setTimeout(() => {
      const box = document.getElementById('chartBox');
      const tip = document.getElementById('chartTip');
      if (box && tip) drawSplitChart(box, tip, days, series);
      ['m1','m2'].forEach(mk=>{
        const b=cov[mk].filter(x=>x.key!=='ns');
        const total=b.reduce((s,x)=>s+x.cnt,0);
        drawPie(
          {svg:'pie'+mk,legend:'legend'+mk,val:'pcVal'+mk,cap:'pcCap'+mk},
          b, total, x=>x.cnt, v=>v+' поз.', 'позиций'
        );
      });
    }, 0);
  }else{
    const whMap=new Map();
    entries.forEach(e=>{if(!whMap.has(e.wh))whMap.set(e.wh,{id:e.wh,name:e.wh,cluster:e.cluster,rows:[]});whMap.get(e.wh).rows.push(e);});
    whMap.forEach(w=>{w.rows.sort((a,b)=>b.sum-a.sum);w.total=w.rows.reduce((s,x)=>s+x.stock,0);w.sum=w.rows.reduce((s,x)=>s+x.sum,0);});
    const mainC=new Map();
    whMap.forEach(w=>{if(!mainC.has(w.cluster))mainC.set(w.cluster,[]);mainC.get(w.cluster).push(w);});
    const sortC=map=>[...map.entries()].map(([c,ws])=>({c,ws,sum:ws.reduce((s,w)=>s+w.sum,0)})).sort((a,b)=>b.sum-a.sum);
    const head=`<tr><th>Артикул</th><th>Название</th><th>Остаток</th><th>Цена</th><th>Сумма</th><th>Дней</th><th>${lbl(d3)}</th><th>${lbl(d2)}</th><th>${lbl(d1)}</th></tr>`;
    const whBlock=(w)=>{
      const body=w.rows.length?w.rows.map(o=>`<tr><td>${esc(o.o)}</td><td>${esc(o.name)}</td><td class="num">${fmt(o.stock)}</td><td class="num">${fmt(o.cost)}</td><td class="num">${fmt(o.sum)}</td>${daysCell(o.stock,o.s1)}${cmpCell(o.s3,o.s4)}${cmpCell(o.s2,o.s3)}${cmpCell(o.s1,o.s2)}</tr>`).join(''):`<tr><td colspan="9" style="color:#94a3b8">нет данных</td></tr>`;
      return `<details class="wh"><summary><span class="whname">${esc(w.name)}</span><span class="whtot">${fmt(w.sum)} ₽ • ${fmt(w.total)} шт</span></summary>
        <div class="tablewrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div></details>`;
    };
    const clusterBlock=(o)=>`<details class="cluster"><summary><span class="clname">${esc(o.c)}</span><span class="cltot">${fmt(o.ws.reduce((s,w)=>s+w.sum,0))} ₽ • ${fmt(o.ws.reduce((s,w)=>s+w.total,0))} шт</span></summary>`+o.ws.sort((a,b)=>b.sum-a.sum).map(w=>whBlock(w)).join('')+`</details>`;
    const mainList=sortC(mainC);
    html+=mainList.map(o=>clusterBlock(o)).join('');
  }
  document.getElementById('clusters').innerHTML=html||'<div class="meta">Нет данных под фильтр.</div>';
  const grandEl=document.getElementById('grand');
  if(MODE==='summary'){
    grandEl.style.display='';
    const tStock=entries.reduce((s,e)=>s+e.stock,0);
    const tSum=entries.reduce((s,e)=>s+e.sum,0);
    grandEl.innerHTML=`<span>ИТОГО по всем складам:</span><span>${fmt(tSum)} ₽ • ${fmt(tStock)} шт</span>`;
  }else{ grandEl.style.display='none'; grandEl.innerHTML=''; }
}
</script></body></html>
