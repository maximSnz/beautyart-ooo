  if(RU_MAP_LOAD) return RU_MAP_LOAD;
  return RU_MAP_LOAD=(async()=>{
    if(!window.d3) await loadJs('https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js');
    if(!window.topojson) await loadJs('https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js');
    const topo=await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json')).json();
    const all=topojson.feature(topo,topo.objects.countries).features, ru=all.find(f=>f.id==='643');
    const W=1000,H=520, pr=d3.geoConicEqualArea().rotate([-100,0]).parallels([50,68]).fitExtent([[12,8],[W-12,H-28]],ru), path=d3.geoPath(pr);
    RU_MAP={W,H,pr,ru:path(ru)}; // соседние страны не рисуем: без рамки их край смотрелся обрезанным прямоугольником
  })().catch(e=>{ RU_MAP=false; });
}
function renderPal(){
  const st=ST(), useDist=st==='distribution'||st==='closed', by={}, miss={}, box={}, nprod={};
  MODEL.forEach(p=>p.rows.forEach(r=>{
    const k=useDist?(r.dist||0):r.req; if(!k) return;
    box[r.c]=(box[r.c]||0)+k; nprod[r.c]=(nprod[r.c]||0)+1;
    if(p.boxes_per_pallet>0) by[r.c]=(by[r.c]||0)+k/p.boxes_per_pallet; else miss[r.c]=(miss[r.c]||0)+1;
  }));
  const cs=[...new Set([...Object.keys(by),...Object.keys(miss)])].sort((a,b)=>(by[b]||0)-(by[a]||0));
  const el=document.getElementById('pal');
  if(!cs.length){ el.className='pal'; el.innerHTML='<div class="mute">Нет заявленных коробов</div>'; return; }
  if(RU_MAP==null){ loadRuMap().then(renderPal); }
  if(!RU_MAP){ // карта не загрузилась (или ещё грузится) — карточки
    el.className='pal';
    el.innerHTML=cs.map(c=>{const x=by[c]||0,[t,cl]=palStatus(x);return `<div class="card"><div class="l">${esc(c)}</div><div class="v">${x.toFixed(2)} пал.</div><div class="${cl}" style="font-size:.85em">${t}</div></div>`;}).join('');
    return;
  }
  const {W,H,pr}=RU_MAP, COL={ok:'#22c55e',warn:'#d97706',bad:'#E33D78',mute:'#94a3b8'};
  PAL_TIPS=[];
  const pts=[], off=[];
  cs.forEach(c=>{
    const x=by[c]||0,[t,cl]=palStatus(x), g=CL_GEO[c], xy=g&&pr(g);
    const tip={h:c,rows:[['Паллет',x>0?nf.format(Math.round(x*100)/100):'— (нет «на паллете»)'],['Загрузка',t,{ok:'g',warn:'y',bad:'r'}[cl]||''],['Коробов',nf.format(box[c]||0)],['Товаров',nf.format(nprod[c]||0)]]};
    const it={c,x,cl,ti:PAL_TIPS.push(tip)-1};
    if(xy&&xy[0]>=0&&xy[0]<=W&&xy[1]>=0&&xy[1]<=H){ it.ax=xy[0]; it.ay=xy[1]; it.px=xy[0]; it.py=xy[1]; it.r=Math.min(28,15+Math.sqrt(x)*3); pts.push(it); } else off.push(it);
  });
  // раздвигаем пересекающиеся кружки (европейская часть плотная); от точки города к кружку — тонкая линия
  for(let k=0;k<120;k++){ let moved=false;
    for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
      const a=pts[i],b=pts[j]; let dx=b.px-a.px, dy=b.py-a.py, d=Math.hypot(dx,dy)||0.01, need=a.r+b.r+3;
      if(d<need){ const m=(need-d)/2; dx/=d; dy/=d; a.px-=dx*m; a.py-=dy*m; b.px+=dx*m; b.py+=dy*m; moved=true; }
    }
    if(!moved) break;
  }
  const fmt=x=>!(x>0)?'—':x<0.05?'<0,1':nf.format(Math.round(x*10)/10); // 0 паллет при коробах — у товаров нет «на паллете», считать не из чего
  el.className='palmap';
  el.innerHTML=`<svg class="rumap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Паллеты по кластерам на карте"><path class="ru" d="${RU_MAP.ru}"/>`
    +pts.map(p=>(Math.hypot(p.px-p.ax,p.py-p.ay)>p.r?`<line class="pl" x1="${p.ax.toFixed(1)}" y1="${p.ay.toFixed(1)}" x2="${p.px.toFixed(1)}" y2="${p.py.toFixed(1)}"/>`:'')+`<circle class="pd" cx="${p.ax.toFixed(1)}" cy="${p.ay.toFixed(1)}" r="2"/>`).join('')
    +pts.map(p=>`<g class="pm" data-ti="${p.ti}"><circle cx="${p.px.toFixed(1)}" cy="${p.py.toFixed(1)}" r="${p.r.toFixed(1)}" fill="${COL[p.cl]||COL.mute}"/><text x="${p.px.toFixed(1)}" y="${p.py.toFixed(1)}">${fmt(p.x)}</text></g>`).join('')
    +`</svg>`+(off.length?`<div class="off">${off.map(p=>`<span class="pm" data-ti="${p.ti}" style="cursor:pointer;color:${COL[p.cl]||COL.mute}">${esc(p.c)}: ${fmt(p.x)} пал.</span>`).join(' · ')}</div>`:'');
  palTipBind();
}
let PAL_TIPS=[];
function palTipBind(){
  const box=document.getElementById('pal'); if(box._tip) return; box._tip=1;
  const tp=document.createElement('div'); tp.className='ptip'; document.body.appendChild(tp);
  let cur=null; const off=()=>{cur=null;tp.classList.remove('on');};
  box.addEventListener('mouseover',e=>{
    const g=e.target.closest('.pm'); if(g===cur) return; off(); if(!g||!box.contains(g)) return;
    const o=PAL_TIPS[+g.dataset.ti]; if(!o) return; cur=g; tp.innerHTML=ptipHtml(o);
    const r=g.getBoundingClientRect(), w=tp.offsetWidth, h=tp.offsetHeight; let x=r.left+r.width/2-w/2, y=r.top-h-10; if(y<8) y=r.bottom+10;
    tp.style.left=Math.max(8,Math.min(innerWidth-w-8,x))+'px'; tp.style.top=y+'px'; requestAnimationFrame(()=>tp.classList.add('on'));
  });
  box.addEventListener('mouseleave',off); window.addEventListener('scroll',off,true);
}

const toInt=v=>{const n=Math.round(Number(String(v).replace(',','.')));return Number.isFinite(n)&&n>=0?n:0;};
function lineRow(p,r,extra){return {week:WEEK,product_id:p.product_id,cluster:r.c,ads:r.ads,available:r.av,transit:r.tr,prev_boxes:r.prev,box_qty:p.box_qty,calc_boxes:r.calc,requested_boxes:r.req,updated_at:new Date().toISOString(),...extra};}

// ===== автораспределение (17.11.2026, решения владельца) =====
// Шаг 1 — по спросу и запасу: обеспеченное товара (ФФ + согласовано) раздаём по коробу в кластер, где запас в днях после поставки
//   ((остаток + в пути + (прошлые заявки + распределено) × в коробе) ÷ спрос) самый маленький; нет спроса ни в одном кластере — пропорционально заявленному.
// Шаг 2 — паллеты (по всем товарам юрлица): кластер вне нормы 0,8–1,15 на паллету (меньше 0,8 — догружаем до 0,8) выравниваем перекладкой коробов
//   одного товара между кластерами: донор — кластер с наибольшим запасом в днях, получатель — с наименьшим; итог товара не меняется;
//   донор не уходит ниже целевого запаса (покрытие + запас) или ниже запаса получателя; кластер в норме не выводим из нормы.
function adDays(p,r,dist){ return r.ads>0?((r.av||0)+(r.tr||0)+((r.prev||0)+dist)*(p.box_qty||0))/r.ads:Infinity; }
function adElig(r){ return !r.blocked&&!r.inactive; }
function adStep1(p){
  const tot=(p.ff||0)+(p.ag||0), rows=p.rows.filter(adElig);
  p.rows.forEach(r=>r.dist=0); if(!tot||!rows.length) return;
  const dem=rows.filter(r=>r.ads>0);
  if(!dem.length||!(p.box_qty>0)){ distribute(p); return; }
  for(let k=0;k<tot;k++){ let best=null,bd=Infinity; for(const r of dem){ const d=adDays(p,r,r.dist); if(d<bd||(d===bd&&r.ads>best.ads)){bd=d;best=r;} } best.dist++; }
}
function adPal(){ const P={}; MODEL.forEach(p=>{ if(!(p.boxes_per_pallet>0)) return; p.rows.forEach(r=>{ if(r.dist) P[r.c]=(P[r.c]||0)+r.dist/p.boxes_per_pallet; }); }); return P; }
// сколько не хватает до нормы: >0 — добавить паллет, <0 — убрать, 0 — в норме (или кластер пуст)
function adNeed(x){ if(!(x>1e-9)) return 0; if(x<0.8) return 0.8-x; const lo=Math.ceil(x/1.15-1e-9), hi=Math.floor(x/0.8+1e-9); if(lo<=hi) return 0;
  const n=Math.floor(x), m=Math.ceil(x), rem=x-1.15*n, add=0.8*m-x; return add<=rem?add:-rem; }
function adStep2(){
  const tgt=c=>WLT[c]?cov(WLT[c])+(Number(WLT[c].target_days)||0):0;
  for(let it=0;it<4000;it++){
    const P=adPal(), bad=Object.keys(P).map(c=>({c,n:adNeed(P[c])})).filter(x=>Math.abs(x.n)>1e-9).sort((a,b)=>Math.abs(a.n)-Math.abs(b.n));
    let moved=false;
    for(const {c,n} of bad){
      // ищем лучший перенос одного короба: в c (n>0) или из c (n<0)
      let best=null;
      for(const p of MODEL){ const bpp=p.boxes_per_pallet; if(!(bpp>0)||!(p.box_qty>0)) continue;
        const rc=p.rows.find(r=>r.c===c&&adElig(r)); if(!rc) continue;
        for(const ro of p.rows){ if(ro===rc||!adElig(ro)) continue;
          const [from,to]=n>0?[ro,rc]:[rc,ro]; if(!(from.dist>0)||!(to.ads>0)) continue;
          const fAfter=adDays(p,from,from.dist-1), tAfter=adDays(p,to,to.dist+1);
          if(!(fAfter>=tgt(from.c)||fAfter>=tAfter)) continue;           // не оголяем донора
          const other=n>0?from.c:to.c, po=P[other]||0, dpo=(n>0?-1:1)/bpp;
          if(adNeed(po)===0&&po>1e-9&&adNeed(po+dpo)!==0&&!(po+dpo<1e-9)) continue; // соседа в норме не ломаем
          const score=fAfter-tAfter; if(!best||score>best.score) best={from,to,score};
        }
      }
      if(best){ best.from.dist--; best.to.dist++; moved=true; break; }
    }
    if(!moved) break;
  }
}
async function autoDist(){
  if(ST()!=='distribution') return;
  const prods=MODEL.filter(p=>p.ag!=null||(p.ff||0)>0);
  if(!confirm(`Автораспределение перезапишет «Распределено» у ${prods.length} товаров (все менеджеры): по спросу и запасу в днях, с подгонкой паллет к норме. Продолжить?`)) return;
  const before=new Map(); MODEL.forEach(p=>p.rows.forEach(r=>before.set(p.product_id+'|'+r.c,r.dist||0)));
  prods.forEach(adStep1); adStep2();
  const now=new Date().toISOString(), rows=[];
  MODEL.forEach(p=>p.rows.forEach(r=>{ const b=before.get(p.product_id+'|'+r.c)||0; if((r.dist||0)!==b||r.dist>0) rows.push(LINES.has(p.product_id+'|'+r.c)?{week:WEEK,product_id:p.product_id,cluster:r.c,distributed_boxes:r.dist||0,updated_at:now}:lineRow(p,r,{distributed_boxes:r.dist||0,updated_at:now})); }));
  const short=rows.filter(x=>!('requested_boxes' in x)), full=rows.filter(x=>'requested_boxes' in x);
  try{ if(short.length) await upsert('purchase_lines',short,'week,product_id,cluster'); if(full.length) await upsert('purchase_lines',full,'week,product_id,cluster'); }catch(e){ fail(e); }
  render();
}

    await loadBase(); await loadWeek();

async function nextStage(){
  const st=ST(), err=document.getElementById('err'); err.textContent='';
  try{
    if(st==='draft'){
      if(!confirm('Отправить заявку закупщику? После этого «Заявлено» и сроки недели менять нельзя.')) return;
      const now=new Date().toISOString(), rows=[];
      MODEL.forEach(p=>p.rows.forEach(r=>{ if(r.keep) rows.push(lineRow(p,r,{updated_at:now})); }));
      await upsert('purchase_lines',rows,'week,product_id,cluster');
      await patchWeek({status:'at_buyer',submitted_at:now});
    }else if(st==='at_buyer'){
      err.innerHTML=`Согласование — в <a href="${SUPPLY_URL}" target="_blank">сводной заявке поставщику</a>.`; return;
      const miss=MODEL.filter(p=>buyOf(p)>0&&p.ag==null);
      if(miss.length){ err.textContent=`Заполните «Согласовано» по всем товарам к закупке (не заполнено: ${miss.length}, напр. ${miss.slice(0,3).map(p=>p.offer_id).join(', ')})`; return; }
      if(!confirm('Отметить заявку согласованной? Обеспеченное (ФФ + согласовано) распределится по кластерам пропорционально заявленному.')) return;
      const now=new Date().toISOString(), rows=[];
      MODEL.forEach(p=>{ distribute(p); p.rows.forEach(r=>{ if(r.req>0||r.dist>0) rows.push({week:WEEK,product_id:p.product_id,cluster:r.c,distributed_boxes:r.dist||0,updated_at:now}); }); });
      await upsert('purchase_lines',rows,'week,product_id,cluster');
      await patchWeek({status:'distribution',agreed_at:now});
    }else if(st==='distribution'){
      if(!confirm('Подтвердить распределение и закрыть неделю?')) return;
      await patchWeek({status:'closed',confirmed_at:new Date().toISOString()});
    }
    await loadBase(); await loadWeek();
  }catch(e){fail(e);}
}
async function stepClick(i,el){
  const st=ST(), cur=st?STAGES.findIndex(s=>s[0]===st):-1;
  if(!st){ if(i===0) return createWeek(); return; }
  if(i===cur+1&&st==='at_buyer'){ window.open(SUPPLY_URL,'_blank'); return; }
  el.classList.add('busy');
  try{ if(i===cur+1) await nextStage(); else if(i<cur) await prevStage(i); }finally{ el.classList.remove('busy'); }
}
async function prevStage(to){
  const i=STAGES.findIndex(s=>s[0]===ST()); if(i<=0) return;
  const j=to==null?i-1:to; if(j<0||j>=i) return;
  if(!confirm(`Вернуть неделю на шаг «${STAGES[j][1]}»?`)) return;
  try{ await patchWeek({status:STAGES[j][0]}); await loadBase(); await loadWeek(); }catch(e){fail(e);}
}
// обеспечено = ФФ + согласовано → по кластерам пропорционально заявленному (в нём уже учтены остатки и транзит);
// при 100% согласования каждый кластер получает ровно заявленное; остаток округления — по большей дробной части
function distribute(p){
  const tot=p.ff+(p.ag||0), w=p.rows.filter(r=>r.req>0);
  p.rows.forEach(r=>r.dist=0); if(!tot||!w.length) return;
  const base=S(w,r=>r.req), key=r=>r.req;
  let used=0; const parts=w.map(r=>{const x=tot*key(r)/base,f=Math.floor(x);used+=f;return {r,f,rem:x-f};});
  parts.sort((a,b)=>b.rem-a.rem||key(b.r)-key(a.r)||b.r.ads-a.r.ads);
  for(let i=0;i<tot-used&&i<parts.length;i++) parts[i].f++;
  parts.forEach(x=>x.r.dist=x.f);
}
// кнопки «−» / «+» у каждого поля числа: меняют на 1 и сохраняют, как ручной ввод (событие change)
function stepNum(b,d){ const i=b.parentNode.querySelector('input'); if(!i||i.disabled) return; const x=Math.max(0,(Number(i.value)||0)+d); i.value=x; i.dispatchEvent(new Event('change',{bubbles:true})); }
function wrapNums(root){ root.querySelectorAll('input.num:not([data-stp])').forEach(i=>{ i.dataset.stp=1; const s=document.createElement('span'); s.className='stp'; s.onclick=e=>e.stopPropagation(); i.replaceWith(s); s.innerHTML='<button type="button" title="−1" onclick="stepNum(this,-1)">−</button>'; s.appendChild(i); s.insertAdjacentHTML('beforeend','<button type="button" title="+1" onclick="stepNum(this,1)">+</button>'); }); }
new MutationObserver(()=>wrapNums(document.getElementById('app'))).observe(document.getElementById('app'),{childList:true,subtree:true});
if(BA_AUTH.has(SUPABASE_URL))go();
